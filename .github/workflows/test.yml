name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m variational_grid.execution_drill
      - run: node --test tests/test_dashboard_model.cjs tests/test_inventory_dashboard_model.cjs tests/test_qqq_dashboard_model.cjs tests/test_hub_bridge.cjs
      - run: node --check variational_grid/web/app.js
      - run: node --check variational_grid/web/inventory.js
      - run: node --check variational_grid/web/qqq.js
      - run: python -m variational_grid demo
      - if: runner.os == 'Linux' && matrix.python == '3.11'
        run: python -m variational_grid inventory-demo --output data/inventory-demo --trajectory trend
      - if: runner.os == 'Linux' && matrix.python == '3.11'
        run: python -m variational_grid qqq-demo --output data/qqq-demo
      - if: runner.os == 'Linux'
        run: bash -n install.sh
